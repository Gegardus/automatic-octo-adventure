test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

azure:
  service: AzureStorage
  storage_account_name: <%= Rails.env.production? || Rails.env.staging? ? ENV.fetch('AZURE_STORAGE_ACCOUNT_NAME') : '' %>
  storage_access_key: <%= Rails.env.production? || Rails.env.staging? ? ENV.fetch('AZURE_STORAGE_ACCESS_KEY') : '' %>
  container: <%= Rails.env.production? || Rails.env.staging? ? ENV.fetch('AZURE_CONTAINER') : '' %>
